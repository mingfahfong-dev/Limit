<style>
  :root{
    --bg:#14171b;--panel:#1c2127;--panel-2:#232a32;--line:#2b323b;--line-soft:#262c34;
    --amber:#e8871e;--amber-dim:rgba(232,135,30,0.16);--rust:#b6532e;--steel:#6fa2bd;
    --text:#eeeae2;--text-mid:#a9aeb6;--text-dim:#6b7280;--ok:#7bab6e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(1200px 500px at 15% -10%, rgba(232,135,30,0.06), transparent 60%),var(--bg);
    color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 60px;}
  .wrap{max-width:920px;margin:0 auto;}
  header{margin-bottom:22px;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--amber);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .eyebrow::before{content:"";width:7px;height:7px;background:var(--amber);display:inline-block;border-radius:1px;transform:rotate(45deg);}
  .ver{margin-left:auto;color:var(--text-dim);border:1px solid var(--line);border-radius:5px;padding:2px 7px;letter-spacing:0.06em;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(24px,4vw,32px);margin:0 0 8px;letter-spacing:-0.01em;}
  .sub{color:var(--text-mid);font-size:13.5px;line-height:1.5;}
  .sub b{color:var(--text-mid);font-weight:600;}

  .mode{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;margin-bottom:12px;}
  .mode button{flex:1;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;background:transparent;border:0;
    color:var(--text-mid);padding:10px 8px;border-radius:8px;cursor:pointer;transition:all .15s ease;}
  .mode button small{display:block;font-family:'JetBrains Mono',monospace;font-weight:400;font-size:10px;color:var(--text-dim);margin-top:2px;letter-spacing:0.04em;}
  .mode button.active{background:var(--amber);color:#14171b;}
  .mode button.active small{color:rgba(20,23,27,0.75);}

  .selector{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:22px;}
  .grp-label{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:0.12em;color:var(--text-dim);margin-bottom:9px;text-transform:uppercase;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .chip-row:last-child{margin-bottom:0;}
  .chip{font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;letter-spacing:0.02em;background:var(--panel-2);
    border:1px solid var(--line);color:var(--text-mid);padding:9px 15px;border-radius:9px;cursor:pointer;transition:all .15s ease;position:relative;}
  .chip:hover{border-color:#3a424c;color:var(--text);}
  .chip.active{background:var(--amber-dim);border-color:var(--amber);color:var(--amber);}
  .chip .new{position:absolute;top:-6px;right:-6px;font-size:8.5px;background:var(--steel);color:#14171b;border-radius:4px;padding:1px 4px;letter-spacing:0.04em;}

  .readout-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);}
  .product-code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;color:var(--text);}
  .product-tag{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);background:rgba(111,162,189,0.12);
    border:1px solid rgba(111,162,189,0.3);padding:3px 9px;border-radius:6px;margin-left:10px;letter-spacing:0.04em;}
  .note-flag{font-family:'JetBrains Mono',monospace;font-size:11.5px;color:var(--rust);background:rgba(182,83,46,0.12);
    border:1px solid rgba(182,83,46,0.35);padding:5px 10px;border-radius:7px;}

  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 16px 14px;}
  .card.changed{border-color:rgba(111,162,189,0.45);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .param-name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14.5px;color:var(--text);}
  .param-unit{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.06em;}
  .target-val{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--amber);text-align:right;}
  .sd-val,.cmp-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-dim);text-align:right;margin-top:2px;}
  .cmp-val{color:var(--steel);}

  .gauge{position:relative;height:34px;margin-top:6px;}
  .gauge-track{position:absolute;top:14px;left:0;right:0;height:5px;background:var(--line-soft);border-radius:3px;}
  .gauge-band{position:absolute;top:14px;height:5px;background:rgba(123,171,110,0.55);border-radius:3px;}
  .gauge-target{position:absolute;top:8px;width:2px;height:17px;background:var(--amber);box-shadow:0 0 8px rgba(232,135,30,0.6);}
  .gauge-target::after{content:"";position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;
    border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--amber);}
  .gauge-tick{position:absolute;top:22px;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-mid);white-space:nowrap;}

  .flat-val{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;margin-top:6px;}
  .flat-val span{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}

  footer{margin-top:24px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);text-align:center;line-height:1.6;}
  @media (max-width:480px){.grid{grid-template-columns:1fr;}}
</style>
</head>

</div>

rget":12.0}}},"JMBL":{"type":"Lump","params":{"FE":{"lower":60.95,"target":62.0,"upper":63.05},"P":{"lower":0.095,"target":0.11,"upper":0.125},"SIO2":{"lower":2.85,"target":3.6,"upper":4.35},"AL2O3":{"lower":2.0,"target":2.3,"upper":2.6},"LOI":{"target":5.0},"H2O":{"lower":2.3,"target":4.1,"upper":5.0},"UNDERSIZE":{"upper":7.0,"target":6.0},"OVERSIZE":{"upper":25.0,"target":20.0}},"sd":{"FE":0.35,"P":0.005,"SIO2":0.25,"AL2O3":0.1,"H2O":0.3}},"MACL":{"type":"Lump","params":{"FE":{"lower":60.25,"target":61.3,"upper":62.35},"P":{"lower":0.09,"target":0.105,"upper":0.12},"SIO2":{"lower":3.55,"target":4.3,"upper":5.05},"AL2O3":{"lower":1.2,"target":1.5,"upper":1.8},"LOI":{"target":6.2},"H2O":{"lower":2.3,"target":4.1,"upper":5.0},"UNDERSIZE":{"upper":7.0,"target":6.0},"OVERSIZE":{"upper":25.0,"target":20.0}},"sd":{"FE":0.35,"P":0.005,"SIO2":0.25,"AL2O3":0.1,"H2O":0.3}},"NJVL":{"type":"Lump","params":{"FE":{"lower":60.88,"target":61.93,"upper":62.98},"P":{"lower":0.071,"target":0.086,"upper":0.101},"SIO2":{"lower":4.38,"target":5.13,"upper":5.88},"AL2O3":{"lower":1.27,"target":1.57,"upper":1.87},"LOI":{"target":3.7},"H2O":{"lower":2.3,"target":4.1,"upper":5.0},"UNDERSIZE":{"upper":7.0,"target":6.0},"OVERSIZE":{"upper":25.0,"target":20.0}},"sd":{"FE":0.35,"P":0.005,"SIO2":0.25,"AL2O3":0.1,"H2O":0.3}},"SFKL":{"type":"Lump","params":{"FE":{"lower":60.45,"target":61.5,"upper":62.55},"P":{"lower":0.035,"target":0.05,"upper":0.065},"SIO2":{"lower":3.05,"target":3.8,"upper":4.55},"AL2O3":{"lower":1.0,"target":1.3,"upper":1.6},"LOI":{"target":5.7},"H2O":{"lower":2.3,"target":4.1,"upper":5.0},"UNDERSIZE":{"upper":7.0,"target":6.0},"OVERSIZE":{"upper":25.0,"target":20.0}},"sd":{"FE":0.35,"P":0.005,"SIO2":0.25,"AL2O3":0.1,"H2O":0.3}}}};
const META = {
  shipping:{title:"Shipping Target Lookup",label:"Shipping Target",eff:"20/08/2026 to 30/06/2027"},
  stockyard:{title:"Mine Stockyard Target Lookup",label:"Stockyard Target",eff:"21/10/2026 to 30/06/2027"}
};
const VERSION = "v2";
const LABELS = {FE:"Fe",P:"P",SIO2:"SiO₂",AL2O3:"Al₂O₃",LOI:"LOI",H2O:"H₂O",UNDERSIZE:"Undersize",OVERSIZE:"Oversize"};
const ORDER = ["FE","P","SIO2","AL2O3","LOI","H2O","UNDERSIZE","OVERSIZE"];
let mode = "shipping", current = "YNDF";

function fmt(v,dec){ return (v===undefined||v===null) ? "—" : v.toFixed(dec); }
const decFor = k => k==="P" ? 3 : 2;
const same = (a,b) => a && b && a.lower===b.lower && a.target===b.target && a.upper===b.upper;

function buildChips(){
  const f=document.getElementById('fines-row'), l=document.getElementById('lump-row');
  f.innerHTML=""; l.innerHTML="";
  Object.keys(DATA[mode]).forEach(code=>{
    const chip=document.createElement('div');
    chip.className='chip'; chip.dataset.code=code; chip.textContent=code;
    if(mode==="stockyard" && !DATA.shipping[code]){
      const t=document.createElement('span'); t.className='new'; t.textContent='SY'; t.title='Stockyard-only product'; chip.appendChild(t);
    }
    chip.addEventListener('click',()=>render(code));
    (DATA[mode][code].type==="Fines"?f:l).appendChild(chip);
  });
}

function setMode(m){
  mode=m;
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));
  const M=META[m];
  document.getElementById('title').textContent=M.title;
  document.title=M.title.replace(" Lookup","s")+" · FY27 · "+VERSION;
  document.getElementById('sub').innerHTML=
    `Iron Ore Product Quality Targets &amp; Internal Non-Conformance Limits — <b>FY27</b>, effective ${M.eff}. `+
    `Select a product to view lower limit, ${M.label.toLowerCase()} and upper limit for each parameter. `+
    `<b>LOI</b> is published as a target only; <b>H₂O</b> carries the limit band.`+
    (m==="stockyard" ? ` Cards outlined in blue differ from the shipping target.` : ``);
  document.getElementById('foot').innerHTML=
    `${VERSION} · Source: FY27 Annual Shipping and Mine Stockyard Targets_v2.pdf · ${M.label}s effective ${M.eff.split(" ")[0]}<br>Queries → Product Quality team`;
  buildChips();
  render(DATA[m][current] ? current : Object.keys(DATA[m])[0]);
}

function render(code){
  current=code;
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.code===code));
  const d=DATA[mode][code], ship=(mode==="stockyard")?DATA.shipping[code]:null;
  document.getElementById('hd-code').textContent=code;
  document.getElementById('hd-tag').textContent=d.type+" · "+META[mode].label;
  let note=d.note?`<span class="note-flag">⚠ ${d.note}</span>`:"";
  if(mode==="stockyard" && !ship) note+=` <span class="note-flag" style="color:var(--steel);border-color:rgba(111,162,189,0.4);background:rgba(111,162,189,0.1)">Stockyard only</span>`;
  document.getElementById('hd-note').innerHTML=note;

  const grid=document.getElementById('gauge-grid'); grid.innerHTML="";
  ORDER.forEach(key=>{
    const p=d.params[key]; if(!p) return;
    const dec=decFor(key), card=document.createElement('div'); card.className='card';
    const sd=d.sd && d.sd[key]!==undefined ? `<div class="sd-val">± ${fmt(d.sd[key],dec)} (3SD)</div>` : "";
    let cmp="";
    if(ship && ship.params[key] && !same(ship.params[key],p)){
      card.classList.add('changed');
      cmp=`<div class="cmp-val">Ship ${fmt(ship.params[key].target,dec)}</div>`;
    }
    const top=`<div class="card-top"><div><div class="param-name">${LABELS[key]}</div><div class="param-unit">%</div></div>
      <div><div class="target-val">${fmt(p.target,dec)}</div>${sd}${cmp}</div></div>`;
    if(p.upper!==undefined){
      const lo=p.lower!==undefined?p.lower:0, hi=p.upper;
      const pad=Math.max((hi-lo)*0.28,hi*0.06), min=Math.max(0,lo-pad), span=hi+pad-min;
      const pct=v=>((v-min)/span)*100;
      card.innerHTML=top+`<div class="gauge"><div class="gauge-track"></div>
        <div class="gauge-band" style="left:${pct(lo)}%;width:${pct(hi)-pct(lo)}%"></div>
        <div class="gauge-target" style="left:${pct(p.target)}%"></div>
        <div class="gauge-tick" style="left:${pct(lo)}%">${p.lower!==undefined?fmt(lo,dec):"0"}</div>
        <div class="gauge-tick" style="left:${pct(hi)}%">${fmt(hi,dec)}</div></div>`;
    } else {
      card.innerHTML=top+`<div class="flat-val"><span>NO SPEC LIMIT — TARGET ONLY</span></div>`;
    }
    grid.appendChild(card);
  });
}

document.querySelectorAll('#mode button').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
setMode("shipping");
</script>
</body>
</html>
